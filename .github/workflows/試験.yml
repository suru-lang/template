# kumu 試験 と kumu 点検 を、Linux と macOS で動かします
name: 試験

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: clang を入れる
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: kumu を入れる
        run: go install github.com/suru-lang/suru/cmd/kumu@main
      - name: 試験
        run: ~/go/bin/kumu 試験
      - name: 点検
        run: ~/go/bin/kumu 点検
